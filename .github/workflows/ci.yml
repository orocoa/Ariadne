name: Verify source and isolation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check public files
        run: python3 scripts/check_public_release.py
      - name: Offline regressions
        run: python3 scripts/run_regressions.py
      - name: Visual system integrity
        run: python3 scripts/check_vi.py
      - name: Install pinned browser test runtime
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/ariadne-browser-deps" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/ariadne-browser-deps/node_modules/playwright/cli.js" install chromium
      - name: Synthetic browser acceptance
        env:
          ARIADNE_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/ariadne-browser-deps/node_modules/playwright
        run: node tests/optimization_browser_qa.mjs
      - name: Preserve synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: optimization-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/optimization-browser/
          if-no-files-found: ignore
          retention-days: 14
      - name: Scan full history with pinned Gitleaks
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' 'b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5' "$RUNNER_TEMP/gitleaks.tar.gz" | shasum -a 256 --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts=--all .
