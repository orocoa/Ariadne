<!doctype html>
<html lang="zh-CN">
  <head>
    <link rel="icon" href="/favicon.ico?v=hands-1" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/icons/favicon-32.png?v=hands-1" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=hands-1" sizes="180x180" />
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="/i18n.js?v=1"></script>
    <title>Ariadne · 职位详情</title>
    <link rel="stylesheet" href="/styles.css?v=candidate-job-parity-v1&amp;vi=1&amp;top-edit=1&amp;composer=4&amp;edit-footer=1&amp;wave=1">
    <link rel="stylesheet" href="/personal-understanding.css">
    <link rel="stylesheet" href="/wave-physics-loader.css?v=2">
    <link rel="stylesheet" href="/job-application.css?v=journal-input-3">
  </head>
  <body class="v1-body" data-v1-page="job-detail">
    <main class="v1-page-shell v1-detail-shell" data-ariadne-shell="detail">
      <header class="v1-topbar">
        <a class="v1-back" href="/jd.html" aria-label="返回职位描述"></a>
        <p class="v1-detail-breadcrumb">职位描述 / 职位上下文</p>
        <details class="v1-menu">
          <summary aria-label="打开导航菜单"><span></span><span></span></summary>
          <nav aria-label="主导航">
            <a href="/workspace.html">工作空间</a><a href="/personal-information.html">个人资料</a><a aria-current="page" href="/jd.html">职位描述</a><a href="/index.html">连接设置</a>
          </nav>
        </details>
      </header>

      <section class="v1-split-view">
        <article class="v1-structured-pane job">
          <div class="v1-detail-meta-row"><span class="v1-detail-chips"><span class="v1-type-chip">职位描述</span><span id="job-review-state" class="v1-review-chip"></span></span><span class="v1-detail-actions"><button id="open-job-edit" class="v1-detail-edit-button" type="button" aria-expanded="false" aria-controls="job-edit-form">编辑</button></span></div>
          <h1 id="job-title">正在读取…</h1>
          <p id="job-company" class="v1-detail-subtitle"></p><p id="job-location" class="v1-detail-time"></p>
          <section class="v1-detail-block"><p class="v1-section-label">摘要</p><p id="job-summary" class="v1-detail-summary"></p></section>
          <section class="v1-detail-block"><p class="v1-section-label">任职要求</p><div id="job-requirements" class="v1-requirement-list"></div></section>
          <section class="v1-detail-block"><p class="v1-section-label">来源</p><p id="job-source" class="v1-source-note"></p></section>
          <section class="v1-detail-block" aria-labelledby="job-application-heading">
            <p id="job-application-heading" class="v1-section-label">投递记录 · <span id="job-application-stage">正在读取…</span></p>
          </section>
          <section class="v1-detail-block" aria-labelledby="job-notes-heading">
            <p id="job-notes-heading" class="v1-section-label">备注</p>
            <div id="job-application-notes" class="v1-requirement-list"></div>
          </section>
          <section class="v1-detail-block" aria-labelledby="job-journal-heading">
            <p id="job-journal-heading" class="v1-section-label">求职记录</p>
            <div id="job-journal-timeline" aria-label="求职记录时间线"></div>
          </section>
          <form id="job-edit-form" class="v1-edit-form v1-detail-state-panel hidden" data-ariadne-edit-shell="detail" aria-hidden="true">
            <label class="v1-edit-field" data-ariadne-edit-field>职位名称<input id="job-edit-title"></label>
            <label class="v1-edit-field" data-ariadne-edit-field>公司<input id="job-edit-company"></label>
            <label class="v1-edit-field" data-ariadne-edit-field>地点<input id="job-edit-location"></label>
            <label class="v1-edit-field" data-ariadne-edit-field>摘要<textarea id="job-edit-summary"></textarea></label>
            <label class="v1-edit-field" data-ariadne-edit-field>任职要求（每行一条）<textarea id="job-edit-requirements"></textarea></label>
            <label class="v1-edit-field" data-ariadne-edit-field>备注<textarea id="job-application-note" rows="5" maxlength="300" placeholder="每行填写一条备注"></textarea></label>
            <label id="job-application-outcome-field" class="v1-edit-field" hidden>结束结果<select id="job-application-outcome"></select></label>
            <section class="v1-journal-edit-section">
              <p class="v1-section-label">求职记录</p>
              <div id="job-journal-editor"></div>
              <button id="job-journal-add" class="v1-edit-text-action" type="button">添加更多</button>
            </section>
            <div class="v1-button-row v1-edit-actions" data-ariadne-edit-actions><button id="preview-job-edit" class="v1-edit-text-action" data-edit-preview type="submit">保存</button><span class="v1-edit-secondary-actions"><button id="cancel-job-edit" class="v1-edit-text-action" data-edit-cancel type="button">取消</button><button id="open-job-delete" class="v1-edit-text-action v1-detail-remove-button" data-edit-destructive type="button">删除</button></span></div>
          </form>
          <section id="job-edit-preview" class="v1-patch-card hidden">
            <p class="v1-section-label">直接编辑预览</p>
            <div class="v1-diff-grid"><div><small>修改前</small><p id="job-edit-before"></p></div><div><small>修改后</small><p id="job-edit-after"></p></div></div>
            <div class="v1-button-row" data-edit-preview-actions><button id="confirm-job-edit" class="v1-primary-button" data-edit-apply type="button">确认保存</button><button id="back-to-job-edit" class="v1-tertiary-button" data-edit-back type="button">返回编辑</button></div>
          </section>
        </article>

        <aside id="job-ai-pane" class="v1-conversation-pane hidden" aria-labelledby="job-ai-heading">
          <div class="v1-conversation-heading"><p class="v1-section-label">AI 对话</p><span id="job-ai-runtime">仅限当前职位</span></div>
          <h2 id="job-ai-heading">职位智能分析</h2>
          <p class="v1-conversation-copy">每次对话都会读取当前职位版本与当前个人资料；未确认的 Working 信息会明确标注，不会写入正式个人资料。</p>
          <div id="job-conversation-messages" class="v1-conversation-messages v1-conversation-thread" aria-live="polite"></div>
          <div id="job-conversation-status" class="v1-conversation-status hidden" aria-live="polite"></div>
          <section id="job-patch-proposal" class="v1-patch-card hidden">
            <p class="v1-section-label">待审核修改建议</p>
            <div class="v1-diff-grid"><div><small>修改前</small><p id="job-patch-before"></p></div><div><small>修改后</small><p id="job-patch-after"></p></div></div>
            <p id="job-patch-reason" class="v1-patch-reason"></p>
            <div class="v1-button-row"><button id="accept-job-patch" class="v1-primary-button" type="button">确认修改</button><button id="reject-job-patch" class="v1-tertiary-button" type="button">拒绝建议</button></div>
          </section>
          <form id="job-conversation-form" class="v1-conversation-form">
            <label class="sr-only" for="job-conversation-input">询问当前职位</label>
            <div class="v1-composer-field"><textarea id="job-conversation-input" placeholder="例如：这份职位最核心的三个要求是什么？"></textarea></div>
            <button type="submit" aria-label="发送"></button>
          </form>
        </aside>

      </section>
      <p id="job-detail-message" class="v1-inline-message" aria-live="polite"></p>
    </main>
    <dialog id="job-journal-lightbox" class="v1-journal-lightbox" aria-label="查看求职记录图片">
      <button id="job-journal-close-image" type="button" class="v1-edit-text-action">关闭图片</button>
      <img id="job-journal-full-image" alt="">
    </dialog>
    <div id="job-delete-popover" class="v1-delete-popover hidden" aria-hidden="true">
      <button class="v1-delete-popover-backdrop" type="button" data-delete-popover-cancel aria-label="关闭删除操作"></button>
      <section class="v1-delete-popover-menu" role="menu" aria-label="删除操作"><button data-job-delete-scope="card" class="v1-delete-popover-option destructive" type="button">仅删除这张卡片</button><button data-job-delete-scope="source" class="v1-delete-popover-option destructive" type="button">移除此文件导入的所有内容</button><button class="v1-delete-popover-option cancel" data-delete-popover-cancel type="button">取消</button></section>
    </div>
    <script src="/conversation-output.js?v=3"></script>

    <script src="/product-shell.js"></script>
    <script src="/product-transport.js"></script>
    <script src="/model-settings-catalog-data.js"></script><script src="/model-settings.js"></script><script src="/runtime-selection-state.js"></script>
    <script src="/runtime-capabilities.js?v=runtime-gate-v1"></script>
    <script src="/runtime-capability-gate.js?v=job-stage-conversation-v1"></script>
    <script src="/workspace-storage-contract.js"></script>
    <script src="/content-document.js?v=1"></script>
    <script src="/content-browser-storage.js?v=1"></script>
    <script src="/content-database.js?v=2"></script>
    <script src="/truth-persistence-domain.js?v=job-intelligence-v1&amp;storage=1"></script>
    <script src="/raw-source-storage-domain.js?v=job-intelligence-v1"></script>
    <script src="/job-intelligence-contract-manifest.js?v=job-stage-conversation-v1"></script>
    <script src="/job-context-domain.js?v=job-intelligence-v1&amp;storage=1&amp;source-link=1"></script>
    <script src="/personal-memory-domain.js?storage=1"></script>
    <script src="/personal-context-domain.js?v=context-direct-1"></script>
    <script src="/personal-understanding-contract.js"></script>
    <script src="/job-candidate-context-domain.js?v=job-intelligence-v1&amp;storage=1"></script>
    <script src="/source-retrieval-domain.js?v=job-intelligence-v1"></script>
    <script src="/job-conversation-domain.js?v=job-stage-conversation-v1"></script>
    <script src="/job-conversation-persistence-domain.js?v=product-convergence-v1"></script>
    <script src="/wave-physics-loader.js?v=1"></script><script src="/processing-indicator-domain.js?v=ui-contract-addendum-v5&amp;wave=1"></script>
    <script src="/conversation-ui-domain.js?v=shared-conversation-ui-v5&amp;composer=3&amp;reply=2"></script>
    <script src="/product-shell-domain.js?v=detail-behavior-v1"></script>
    <script src="/local-context-lifecycle-domain.js?v=lifecycle-final-v1"></script>
    <script src="/local-job-lifecycle-domain.js?v=lifecycle-final-v1"></script>
    <script src="/job-followup-storage.js?v=1"></script>
    <script src="/job-application-domain.js?v=job-stage-conversation-v1&amp;storage=1"></script>
    <script src="/job-journal-domain.js?v=2"></script>
    <script src="/job-journal-ui.js?v=job-stage-conversation-v1"></script>
    <script src="/v1-demo-domain.js?v=v1-motion-33&amp;storage=1"></script>
    <script src="/scoped-conversation-domain.js"></script>
    <script src="/floating-window.js?v=v1-motion-33"></script>
    <script src="/personal-memory-bridge.js"></script>
    <script src="/v1-pages.js?v=job-stage-conversation-v1&amp;job-stage-chip=2&amp;storage=2&amp;source-link=1"></script>
    <script src="/conversation-model-selector.js?v=model-effort-2"></script>
    <script src="/conversation-attachments.js?v=inline-composer-4&amp;composer=3&amp;storage=1"></script>
    <script src="/conversation-turn-transport.js?v=model-live-2"></script>
  </body>
</html>
