    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=hands-1" sizes="180x180" />
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Ariadne · 了解我</title>
    <link rel="stylesheet" href="/styles.css?v=personal-understanding-v1&amp;vi=1&amp;composer=4&amp;consent-hint=1&amp;wave=1">
    <link rel="stylesheet" href="/personal-understanding.css?v=card-proposals-1">
    <link rel="stylesheet" href="/understanding-chat.css?v=4&amp;composer=4">
    <link rel="stylesheet" href="/wave-physics-loader.css?v=2">
  </head>
  <body class="v1-body" data-v1-page="personal-understanding">
    <main class="v1-page-shell personal-understanding-shell">
      <header class="v1-topbar">
        <a class="v1-back" href="/personal-information.html" aria-label="返回个人资料" title="返回个人资料"></a>
        <p class="v1-detail-breadcrumb">个人资料 / 个人理解</p>
        <a class="personal-add-link" href="/personal-import.html">＋ 添加资料</a>
      </header>
      <div class="personal-understanding-layout">
        <section class="personal-knowledge" aria-labelledby="understanding-heading">
          <div class="personal-heading-row"><div><p class="v1-section-label">随资料与补充更新</p><h1 id="understanding-heading">我目前如何理解你</h1></div><button id="refresh-understanding" class="v1-secondary-button" type="button">更新理解</button></div>
          <p id="understanding-state" class="personal-meta" aria-live="polite">正在读取个人资料…</p>
          <a class="personal-chat-jump" href="#personal-dialogue-heading">开始对话 ↓</a>
          <p id="understanding-summary" class="personal-overview"></p>
          <div id="understanding-insights"></div>
          <div id="understanding-unknowns"></div>
          <section class="personal-memories" aria-labelledby="memory-heading">
            <div class="personal-heading-row"><h2 id="memory-heading">你已保存的补充</h2><span id="memory-count" class="personal-meta"></span></div>
            <p class="personal-meta">这些信息会用于之后的个人对话和职位分析。资料原文与模型推断仍分别保留。</p>
            <div id="saved-memories"></div>
          </section>
          <details class="personal-history"><summary>查看补充的历史版本</summary><div id="memory-history"></div></details>
        </section>
        <section class="personal-dialogue v1-conversation-pane" aria-label="了解我对话" data-entry-confirmation="visit">
          <span id="personal-runtime" class="personal-meta hidden"></span>
          <p class="personal-meta">围绕过去的项目、你的职责与做事方式跨资料讨论，也可以随时补充。需要记住的信息会先放到下方，由你确认保存。</p>
          <div id="personal-origin" class="personal-origin hidden"></div>
          <div id="personal-intro" class="understanding-intro" hidden>
            <p id="personal-dialogue-heading" class="understanding-intro-copy">关于这些信息或许你想问</p>
            <div class="personal-prompts" aria-label="开始讨论">
              <button type="button" data-personal-prompt="结合我的不同资料，你目前如何理解我的经历？哪些地方还不确定？">你目前如何理解我</button>
              <button type="button" data-personal-prompt="不同资料之间，有哪些互补或相互矛盾的信息需要我澄清？">资料之间的联系</button>
              <button type="button" data-personal-prompt="我想补充一条个人信息：">补充一点关于我</button>
            </div>
          </div>
          <button id="personal-older-messages" type="button" class="personal-text-button hidden">查看更早对话</button>
          <div id="personal-conversation-messages" class="v1-conversation-messages v1-conversation-thread" aria-live="polite"></div>
          <section id="personal-card-proposals" aria-label="待确认的资料卡变更"></section>
          <section id="personal-proposals" aria-label="待确认的个人补充"></section>
          <div id="personal-processing" class="v1-conversation-status hidden" aria-live="polite"></div>
          <form id="personal-conversation-form" class="v1-conversation-form">
            <label class="sr-only" for="personal-message">讨论经历或补充个人信息</label>
            <div class="v1-composer-field"><textarea id="personal-message" maxlength="6000" placeholder="聊聊你的经历…"></textarea></div>
            <button type="submit" aria-label="发送"></button>
          </form>
          <label class="personal-consent"><input id="personal-model-consent" type="checkbox"><span id="personal-consent-copy">问题、相关个人资料及对话历史将发送至当前模型；更新理解可能分批调用并产生 API 费用。</span></label>
          <p id="personal-context-usage" class="personal-meta"></p>
          <p id="personal-message-status" class="v1-inline-message" aria-live="polite"></p>
        </section>
      </div>
    </main>
    <script src="/conversation-output.js?v=3"></script>
    <script src="/product-config.js"></script>
    <script src="/product-shell.js"></script>
    <script src="/product-transport.js"></script>

    <script src="/personal-memory-domain.js?storage=1"></script>
    <script src="/personal-context-domain.js?v=context-direct-1"></script>
    <script src="/personal-candidate-card-domain.js?v=1"></script>
    <script src="/job-intelligence-contract-manifest.js"></script>
    <script src="/personal-understanding-contract.js"></script>

    <script src="/personal-understanding-domain.js?v=card-proposals-1"></script>
    <script src="/wave-physics-loader.js?v=1"></script><script src="/processing-indicator-domain.js?v=wave-1"></script>
    <script src="/conversation-ui-domain.js?composer=3&amp;intro=1&amp;reply=2&amp;consent-hint=1"></script>
    <script src="/v1-demo-domain.js?storage=1"></script>
    <script src="/v1-pages.js?storage=2"></script>
    <script src="/personal-understanding.js?v=card-proposals-1"></script>
    <script src="/conversation-model-selector.js?v=model-effort-2"></script>
    <script src="/conversation-attachments.js?v=inline-composer-4&amp;composer=3&amp;storage=1"></script>
    <script src="/conversation-turn-transport.js?v=model-live-2"></script>
  </body>
</html>
